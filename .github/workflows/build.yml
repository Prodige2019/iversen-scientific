name: Build all targets

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'application (PyInstaller)
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend;frontend" run_desktop.py

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Construire l'installateur
        working-directory: iversen_engine
        run: |
          mkdir installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-windows-installer
          path: iversen_engine/installer_output/IversenScientific-Setup.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'app macOS
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend:frontend" run_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-macos-dmg
          path: iversen_engine/dist/IversenScientific

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Compiler l'APK
        working-directory: iversen_mobile
        env:
          CHAQUOPY_BUILD_PYTHON: python3.11
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-android-apk
          path: iversen_mobile/build/app/outputs/flutter-apk/app-release.apk
