name: Build all targets
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer ou mettre à jour la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Derniers builds"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-exe:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compiler l'application (PyInstaller)
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend;frontend" run_desktop.py
      - name: Installer Inno Setup
        run: choco install innosetup -y
      - name: Construire l'installateur
        working-directory: iversen_engine
        run: |
          mkdir installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Publier sur la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          files: iversen_engine/installer_output/IversenScientific-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-dmg:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compiler l'app macOS
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend:frontend" run_desktop.py
      - name: Compresser l'app en zip
        working-directory: iversen_engine/dist
        run: zip -r IversenScientific-macos.zip IversenScientific
      - name: Publier sur la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          files: iversen_engine/dist/IversenScientific-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-apk:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Compiler l'APK
        working-directory: iversen_mobile
        env:
          CHAQUOPY_BUILD_PYTHON: python3.11
        run: |
          flutter pub get
          flutter build apk --release
      - name: Publier sur la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          files: iversen_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
