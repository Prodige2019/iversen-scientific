name: Build all targets

on:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'EXE
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name IversenScientific --add-data "frontend;frontend" run_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-windows-exe
          path: iversen_engine/dist/IversenScientific.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'app macOS
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onefile --name IversenScientific --add-data "frontend:frontend" run_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-macos-dmg
          path: iversen_engine/dist/IversenScientific

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Compiler l'APK
        working-directory: iversen_mobile
        env:
          CHAQUOPY_BUILD_PYTHON: python3.11
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-android-apk
          path: iversen_mobile/build/app/outputs/flutter-apk/app-release.apk