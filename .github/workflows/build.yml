name: Build all targets

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injecter le numero de version courant
        shell: bash
        working-directory: iversen_engine/frontend
        run: sed -i "s/const CURRENT_VERSION = \"[0-9.]*\";/const CURRENT_VERSION = \"1.0.${{ github.run_number }}\";/" index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'application (PyInstaller)
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend;frontend" run_desktop.py

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Construire l'installateur
        working-directory: iversen_engine
        run: |
          mkdir installer_output
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zipper l'installateur
        working-directory: iversen_engine/installer_output
        run: Compress-Archive -Path IversenScientific-Setup.exe -DestinationPath IversenScientific-windows-installer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-windows-installer
          path: iversen_engine/installer_output/IversenScientific-windows-installer.zip
          retention-days: 1

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injecter le numero de version courant
        shell: bash
        working-directory: iversen_engine/frontend
        run: sed -i "s/const CURRENT_VERSION = \"[0-9.]*\";/const CURRENT_VERSION = \"1.0.${{ github.run_number }}\";/" index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler l'app macOS
        working-directory: iversen_engine
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --onedir --windowed --name IversenScientific --icon icon.ico --add-data "frontend:frontend" run_desktop.py

      - name: Zipper l'application
        working-directory: iversen_engine/dist
        run: zip -r IversenScientific-macos-dmg.zip IversenScientific

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-macos-dmg
          path: iversen_engine/dist/IversenScientific-macos-dmg.zip
          retention-days: 1

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injecter le numero de version courant
        shell: bash
        working-directory: iversen_engine/frontend
        run: sed -i "s/const CURRENT_VERSION = \"[0-9.]*\";/const CURRENT_VERSION = \"1.0.${{ github.run_number }}\";/" index.html

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Compiler l'APK
        working-directory: iversen_mobile
        env:
          CHAQUOPY_BUILD_PYTHON: python3.11
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: IversenScientific-android-apk
          path: iversen_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  create-release:
    needs: [windows-exe, macos-dmg, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Iversen Scientific — build ${{ github.run_number }}"
          files: |
            downloaded/IversenScientific-windows-installer/IversenScientific-windows-installer.zip
            downloaded/IversenScientific-macos-dmg/IversenScientific-macos-dmg.zip
            downloaded/IversenScientific-android-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
